[project]
name = "citygml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "chuppy", email = "noreply@safmod.ch" }
]
requires-python = ">=3.14"
dependencies = [
    "lxml>=6.1.2",
    "numpy>=2.5.2",
    "pip>=26.2.1",
    "tqdm>=4.70.0",
]

[project.scripts]
citygml = "citygml:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "blender-python-stubs>=5.1.0.3",
]

[tool.basedpyright]
# Point to the .venv created by uv
venvPath = "."
venv = ".venv"
